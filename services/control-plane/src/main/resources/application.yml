server:
  port: ${SPRING_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: atlas-control-plane
  profiles:
    active: ${APP_ENV:development}
  lifecycle:
    timeout-per-shutdown-phase: 10s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSZ}","level":"%p","service":"${spring.application.name}","environment":"${APP_ENV:development}","message":"%m"}%n'
