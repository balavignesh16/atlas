services:
  control-plane:
    build:
      context: ./services/control-plane
    ports:
      - "${SPRING_PORT:-8080}:8080"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - SPRING_PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  intelligence-engine:
    build:
      context: ./services/intelligence-engine
    ports:
      - "${ATLAS_ENGINE_PORT:-8081}:8081"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - ATLAS_ENGINE_PORT=8081
      - ATLAS_EXECUTION_ENABLED=${ATLAS_EXECUTION_ENABLED:-false}
      - ATLAS_EXECUTION_PROVIDER=${ATLAS_EXECUTION_PROVIDER:-docker}
      - ATLAS_EXECUTION_TIMEOUT_SECONDS=${ATLAS_EXECUTION_TIMEOUT_SECONDS:-30}
      - ATLAS_SECURITY_ENABLED=${ATLAS_SECURITY_ENABLED:-false}
      - ATLAS_API_KEYS=${ATLAS_API_KEYS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  atlas-agent:
    build:
      context: ./agents/atlas-agent
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - ATLAS_AGENT_PORT=8082

  atlas-gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - ORDER_SERVICE_URL=http://order-service:8084
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - order-service

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      - ORDER_SERVICE_PORT=8084
      - INVENTORY_SERVICE_URL=http://inventory-service:8085
      - PAYMENT_SERVICE_URL=http://payment-service:8086
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - inventory-service
      - payment-service

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      - INVENTORY_SERVICE_PORT=8085
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    environment:
      - PAYMENT_SERVICE_PORT=8086
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  otel-collector:
    image: otel/opentelemetry-collector:0.106.1
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infrastructure/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    restart: unless-stopped
